name: Campaña de barbecho

# Una pasada por campaña. La campaña acaba el 31 de agosto y las últimas escenas tardan unos
# días en llegar al catálogo, así que se lanza a mediados de septiembre. A mano sirve para
# rehacer una campaña anterior o una sola comunidad.
# Proyecto aparcado: sin ejecución programada. Para reactivarlo, volver a poner
#   schedule:
#     - cron: "0 5 15 9 *"
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Campaña (año de la cosecha; vacío = la de este año)"
        required: false
      region:
        description: "Código INE de la comunidad (02 Aragón, 07 Castilla y León; vacío = las dos)"
        required: false
      web_only:
        description: "Solo rehacer la página con las campañas ya guardadas"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: campana
  cancel-in-progress: false

jobs:
  campana:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Each finished cell is saved under data/cache/parts, so a run cut by the time limit
      # resumes where it stopped when launched again.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Cifras oficiales
        # The ministry's and Aragon's servers sometimes refuse foreign runners; the CSVs
        # already in data/official are then kept.
        continue-on-error: true
        run: python -m fallow official

      - name: Histogramas
        if: ${{ !inputs.web_only }}
        env:
          YEAR: ${{ inputs.year }}
          REGION: ${{ inputs.region }}
        run: |
          YEAR=${YEAR:-$(date +%Y)}
          ARGS="--year $YEAR --workers 3"
          [ -n "$REGION" ] && ARGS="$ARGS --region $REGION"
          python -m fallow hist $ARGS

      - name: Calibración y página
        run: |
          python -m fallow calibrate || echo "::warning::sin campañas de calibración todavía"
          python -m fallow web

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/hist data/official data/validation docs
          git diff --cached --quiet && exit 0
          git commit -m "Campaña ${{ inputs.year || 'del año' }}: histogramas y página"
          git push
